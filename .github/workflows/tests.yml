name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AFMobile/package-lock.json

      - name: Install dependencies
        working-directory: AFMobile
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: AFMobile
        run: npm test -- --ci --forceExit

  backend-tests:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test AFBack.Tests --configuration Release --logger "console;verbosity=normal"
